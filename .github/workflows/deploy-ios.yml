name: build-ios

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Override build number (leave blank for automatic)'
        required: false
        type: string

jobs:
  build-ios:
    name: build-ios
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: navcore_mobile
        run: |
          flutter pub get

      - name: Compute build number
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            BUILD_NUMBER=${{ github.run_number }}
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Computed build number: $BUILD_NUMBER"

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -x

          # Define file paths
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Fail fast with a clear message if the secrets aren't actually configured
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 secret is empty or not set"
            exit 1
          fi
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::BUILD_PROVISION_PROFILE_BASE64 secret is empty or not set"
            exit 1
          fi

          # Decode certificate and provisioning profile using python3 with auto-padding repair
          python3 -c "import base64, os; s = os.environ['BUILD_CERTIFICATE_BASE64'].strip().replace('\r', '').replace('\n', ''); s += '=' * (-len(s) % 4); open('$CERTIFICATE_PATH', 'wb').write(base64.b64decode(s))"
          python3 -c "import base64, os; s = os.environ['BUILD_PROVISION_PROFILE_BASE64'].strip().replace('\r', '').replace('\n', ''); s += '=' * (-len(s) % 4); open('$PP_PATH', 'wb').write(base64.b64decode(s))"

          echo "Decoded certificate size: $(wc -c < "$CERTIFICATE_PATH") bytes"
          echo "Decoded provisioning profile size: $(wc -c < "$PP_PATH") bytes"
          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate file is empty - check BUILD_CERTIFICATE_BASE64 secret content"
            exit 1
          fi
          if [ ! -s "$PP_PATH" ]; then
            echo "::error::Decoded provisioning profile file is empty - check BUILD_PROVISION_PROFILE_BASE64 secret content"
            exit 1
          fi

          # Convert to macOS native format using runner's openssl to ensure 100% Keychain compatibility
          openssl pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin pass:"$P12_PASSWORD" -out "$RUNNER_TEMP/cert_key.pem"
          openssl pkcs12 -export -in "$RUNNER_TEMP/cert_key.pem" -out "$RUNNER_TEMP/apple_cert.p12" -passout pass:"$P12_PASSWORD" -legacy || \
          openssl pkcs12 -export -in "$RUNNER_TEMP/cert_key.pem" -out "$RUNNER_TEMP/apple_cert.p12" -passout pass:"$P12_PASSWORD"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate and private key to keychain
          security import "$RUNNER_TEMP/apple_cert.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify code signing identity
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS Application
        working-directory: navcore_mobile
        run: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=ios/ExportOptions.plist

      - name: Find IPA path
        run: |
          IPA_PATH=$(find navcore_mobile/build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA file not found in navcore_mobile/build/ios/ipa"
            exit 1
          fi
          echo "Found IPA path: $IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Clean up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: navcore_mobile/build/ios/ipa/*.ipa
